name: Build Quizistan APK

# Push-based route: full Flutter source lives at the repo root.
# On every push to main, builds a release APK on GitHub's servers and
# publishes it as a Release so it can be downloaded as a plain .apk
# on a phone (no artifact/zip handling needed).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'

      - name: Build release APK
        working-directory: quizistan-app
        run: |
          rm -f android/local.properties
          flutter pub get
          flutter build apk --release

      - name: Publish APK as a release download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-apk-${{ github.run_number }}
          name: Quizistan test APK #${{ github.run_number }}
          body: |
            Test build of Quizistan Academy.
            Install steps: uninstall the old Quizistan app first
            (Settings > Apps > Quizistan Academy > Uninstall),
            then install this APK. Login needs Firebase (coming next).
          files: quizistan-app/build/app/outputs/flutter-apk/app-release.apk
