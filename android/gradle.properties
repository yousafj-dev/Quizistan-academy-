org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Djava.net.preferIPv6Addresses=true
android.useAndroidX=true
# Proxy for dependency downloads (local forwarder -> upstream egress proxy)
# NOTE: must be 'localhost' (not 127.0.0.1) so Java resolves it to ::1,
# because Java IPv4 TCP is blocked in this sandbox.
systemProp.http.proxyHost=localhost
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=localhost
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
org.gradle.daemon=false
